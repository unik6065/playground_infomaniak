---
# handlers file for roles/monitoring/consul_exporter

- name: Reload_daemon_and_restart_consul_exporter
  systemd:
    name: consul_exporter
    state: restarted
    daemon_reload: true
    enabled: true
    
- name: Reload_consul
  ansible.builtin.systemd:
    name: consul
    state: reloaded
  when: consul_services