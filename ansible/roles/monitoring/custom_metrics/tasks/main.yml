---
# tasks file for roles/monitoring/check_backups

- name: Install cron
  ansible.builtin.apt:
    name: cron
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure cron is started
  ansible.builtin.service:
    name: cron
    state: started

- name: Install /opt/scripts
  ansible.builtin.file:
    path: /opt/scripts
    state: directory
    owner: root
    group: root
    mode: "0750"


- name: Deploy check script
  ansible.builtin.template:
    src: check-custom-metrics.sh.j2
    dest: /opt/scripts/custom-metrics.sh
    owner: root
    group: root
    mode: "0750"

- name: Add a cron for custom metrics
  ansible.builtin.template:
    src: custom-metrics.j2
    dest: /etc/cron.d/custom-metrics
    owner: root
    group: root
    mode: "0750"